name: Marketplace Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Generate example mockup
        run: npm run example:mockup

      - name: Run UI validation gates
        run: npm run validate:ui

      - name: Run visual check
        run: npm run visual:check

      - name: Validate source plugin
        run: npm run plugin:validate

      - name: Package local marketplace
        run: npm run plugin:package

      - name: Validate packaged plugin
        run: npm run plugin:validate -- dist/marketplace/plugins/codex-frontend-plugin

      - name: Archive marketplace
        run: |
          cd dist/marketplace
          zip -r ../codex-frontend-plugin-marketplace.zip .

      - name: Upload marketplace artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-frontend-plugin-marketplace
          path: dist/codex-frontend-plugin-marketplace.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/codex-frontend-plugin-marketplace.zip \
            --title "$TAG_NAME" \
            --notes "Codex Frontend Visual marketplace package."
