name: Marketplace Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Generate example mockup
        run: npm run example:mockup

      - name: Run full UI quality validation
        run: npm run validate:ui

      - name: Validate source plugin
        run: npm run plugin:validate

      - name: Validate source marketplace
        run: npm run marketplace:validate

      - name: Package local marketplace
        run: npm run plugin:package

      - name: Validate packaged marketplace
        run: npm run marketplace:validate -- dist/marketplace

      - name: Validate packaged plugin
        run: npm run plugin:validate -- dist/marketplace/plugins/codex-frontend-plugin

      - name: Archive marketplace
        run: |
          cd dist/marketplace
          zip -r ../codex-frontend-plugin-marketplace.zip .

      - name: Upload marketplace artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-frontend-plugin-marketplace
          path: dist/codex-frontend-plugin-marketplace.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download marketplace artifact
        uses: actions/download-artifact@v7
        with:
          name: codex-frontend-plugin-marketplace
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/codex-frontend-plugin-marketplace.zip \
            --title "$TAG_NAME" \
            --notes "Codex Frontend Visual marketplace package."
