name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Generate example mockup
        run: npm run example:mockup

      - name: Run full UI quality validation
        run: npm run validate:ui

      - name: Validate source plugin
        run: npm run plugin:validate

      - name: Validate source marketplace
        run: npm run marketplace:validate

      - name: Package local marketplace
        run: npm run plugin:package

      - name: Validate packaged marketplace
        run: npm run marketplace:validate -- dist/marketplace

      - name: Validate packaged plugin
        run: npm run plugin:validate -- dist/marketplace/plugins/codex-frontend-plugin
